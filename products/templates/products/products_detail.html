{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<a href="{% url 'products' %}" class="btn btn-link mb-3 fs-3 text-decoration-none"><i class="bi bi-arrow-left"></i></a>
<div class="row">
    <div class="col-md-5">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded">
        {% endif %}
    </div>
    <div class="col-md-7">
        <h1>{{ product.name }}</h1>
        <p class="text-muted">{{ product.description }}</p>
        <h3>{{ product.price }} so'm</h3>
        <form method="POST" action="{% url 'add_to_bag' product.id %}">
            {% csrf_token %}
            <input type="hidden" name="quantity" value="1">
            <input type="hidden" name="redirect_url" value="{{ request.path }}">
            <button type="submit" class="btn btn-dark">Savatga qo'shish</button>
        </form>
    </div>
</div>
{% endblock %}
