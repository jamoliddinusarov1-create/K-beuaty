{% extends "base.html" %}
{% block title %}Mahsulotlar{% endblock %}

{% block content %}
<h1 class="mb-4">Bizning mahsulotlar</h1>
<div class="row">
    {% for product in products %}
    <div class="col-md-3 mb-4">
        <div class="card h-100">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">
            {% endif %}
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.price }} so'm</p>
                <a href="{% url 'product_detail' product.slug %}" class="btn btn-outline-dark mt-auto">Batafsil</a>
                <form method="POST" action="{% url 'add_to_bag' product.id %}" class="mt-2">
                    {% csrf_token %}
                    <input type="hidden" name="quantity" value="1">
                    <input type="hidden" name="redirect_url" value="{{ request.path }}">
                    <button type="submit" class="btn btn-dark w-100">Savatga qo'shish</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
